<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Send Emergency Alert</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; background: #111; color: #eee; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 14px; font-size: .9rem; color: #bbb; }
  input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; }
  textarea { height: 90px; }
  button { margin-top: 18px; width: 100%; padding: 12px; background: #c0392b; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { margin-top: 14px; font-size: .9rem; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>📡 Send Emergency Alert</h1>
  <label>Admin key
    <input id="adminKey" type="password" placeholder="X-Admin-Key" />
  </label>
  <label>Title
    <input id="title" type="text" placeholder="e.g. Earthquake Warning" />
  </label>
  <label>Message
    <textarea id="body" placeholder="Alert details for recipients..."></textarea>
  </label>
  <label>Severity
    <select id="severity">
      <option value="test">Test</option>
      <option value="severe" selected>Severe</option>
      <option value="extreme">Extreme</option>
    </select>
  </label>
  <button id="sendBtn">Send Alert to All Registered Devices</button>
  <div id="status"></div>

<script>
  const statusEl = document.getElementById('status');
  document.getElementById('sendBtn').addEventListener('click', async () => {
    const adminKey = document.getElementById('adminKey').value;
    const title = document.getElementById('title').value.trim();
    const body = document.getElementById('body').value.trim();
    const severity = document.getElementById('severity').value;
    if (!adminKey || !title || !body) {
      statusEl.textContent = 'Admin key, title, and message are all required.';
      return;
    }
    statusEl.textContent = 'Sending...';
    try {
      const res = await fetch('/alerts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
        body: JSON.stringify({ title, body, severity }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      statusEl.textContent = `Sent. Alert #${data.alert.id} — pushed to ${data.push.sent} device(s), pruned ${data.push.pruned} dead token(s).`;
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
    }
  });
</script>
</body>
</html>
